<meta name="apple-mobile-web-app-title" content="News Pulse">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--cd:#f5f6f8;--tx:#10131c;--mu:#6b7280;--ac:#ff1744;--bd:#e6e8f0;--sh:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0e15;--cd:#151925;--tx:#eef0f7;--mu:#9aa3b5;--bd:#232a3a;--sh:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.sp{position:absolute;inset:0;z-index:50;background:linear-gradient(135deg,#ff1744,#c2002f);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:sp 2s forwards}
@keyframes sp{0%,75%{opacity:1}100%{opacity:0;visibility:hidden}}
.sp b{font-size:30px;margin-top:10px;animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.pl{stroke-dasharray:100;stroke-dashoffset:100;animation:dr 5s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:100}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
.hd{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.lg{flex:1;display:flex;align-items:center;gap:9px;line-height:1}
.wm{font-weight:700;font-size:22px}
.wm b{background:linear-gradient(90deg,#ff1744,#c2002f);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm small{display:block;font-size:11px;font-weight:500;color:var(--mu);margin-top:3px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--cd);box-shadow:var(--sh);font-size:17px}
.tk{display:flex;align-items:center;margin:4px 16px 8px;background:var(--cd);border-radius:12px;overflow:hidden;box-shadow:var(--sh);font-size:13.5px}
.tk em{background:var(--ac);color:#fff;font-style:normal;font-weight:700;padding:6px 10px;display:flex;align-items:center;gap:6px;z-index:1}
.tk em:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.tk div{overflow:hidden;white-space:nowrap;flex:1}
.tk span{display:inline-block;padding-left:100%;animation:mq 150s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
main{flex:1;position:relative;overflow:hidden}
.pg{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 20px;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s;overscroll-behavior:contain}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}
.sec h2{margin:0;font-size:19px}
.sec span{font-size:12px;color:var(--mu)}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hero::-webkit-scrollbar{display:none}
.sl{flex:0 0 88%;scroll-snap-align:center;height:210px;border-radius:22px;position:relative;overflow:hidden;color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--sh)}
.sl .e{position:absolute;right:14px;top:6px;font-size:78px;opacity:.9;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(4deg)}}
.sl:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 65%)}
.sl>*{position:relative;z-index:1}
.sl h3{margin:4px 0 0;font-size:19px;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);align-self:flex-start}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--bd);transition:.3s}
.dots i.on{width:20px;background:var(--ac)}
.dg{background:var(--cd);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.di{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;border-bottom:1px solid var(--bd)}
.di:last-child{border:0}
.nm{font-size:26px;font-weight:700;color:var(--ac);opacity:.85;min-width:26px;line-height:1}
.di h4,.cr h4{margin:0;font-size:15.5px;line-height:1.4;font-weight:600}
.mt{font-size:12px;color:var(--mu);margin-top:3px}
.tr{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.tr::-webkit-scrollbar{display:none}
.tc{flex:0 0 150px;border-radius:16px;padding:12px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh)}
.tc h4{margin:0;font-size:14px;line-height:1.35}
.tc .e{font-size:28px}
.cr{display:flex;gap:12px;background:var(--cd);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--sh)}
.th{flex:0 0 78px;height:78px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px}
.cr>div:last-child{flex:1;min-width:0}
.tag{font-size:11.5px;font-weight:700;color:var(--ac)}
.tap{position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.tap:active{transform:scale(.97)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none;width:30px;height:30px;margin:-15px 0 0 -15px}
@keyframes rp{to{transform:scale(14);opacity:0}}
.rv{opacity:0;transform:translateY(18px);transition:.6s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
.ch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 0 10px}
.ch::-webkit-scrollbar{display:none}
.ch button{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--cd);box-shadow:var(--sh);font-size:14px;transition:.25s}
.ch .on{background:var(--ac);color:#fff;transform:scale(1.05)}
.sr{width:100%;font:inherit;padding:12px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);margin-top:6px}
.em{text-align:center;color:var(--mu);padding:50px 0}
.ft{text-align:center;color:var(--mu);font-size:12.5px;padding:18px 0 4px}

{c:"রাজনীতি",e:"🗳️",t:"জামায়াত আমির ডা. শফিকুর রহমান তুরস্কের পথে",b:"বিরোধীদলীয় নেতা ও জামায়াতে ইসলামীর আমির ডা. শফিকুর রহমান বুধবার (৭ অক্টোবর) সকালে তুরস্কের উদ্দেশে ঢাকা ত্যাগ করেছেন। তিনি তুরস্কের ইস্তাম্বুল ইউনিভার্সিটিতে ‘সেকেন্ড ইন্টারন্যাশনাল কনফারেন্স অন বাংলাদেশ স্টাডিজ’-এ প্রধান অতিথি হিসেবে বক্তব্য দেবেন। এরপর সৌদি আরবে ওমরাহ পালন করে ১১ অক্টোবর সকালে তাঁর দেশে ফেরার কথা রয়েছে.",s:"",l:"ঢাকা",tg:["জামায়াত","তুরস্ক","রাজনীতি"],p:1,br:1,tr:0,m:"৭ অক্টোবর",et:"Jamaat chief Dr Shafiqur Rahman leaves for Turkey",eb:"Leader of the Opposition and Jamaat-e-Islami chief Dr Shafiqur Rahman left Dhaka for Turkey on the morning of Wednesday, 7 October. He will speak as chief guest at the 'Second International Conference on Bangladesh Studies' at Istanbul University, then perform Umrah in Saudi Arabia and is due back on the morning of 11 October."},

{c:"আইন ও আদালত",e:"⚖️",t:"আদালত থেকে আসামি পালানোর ঘটনায় পুলিশ সদস্য বরখাস্ত, তদন্তে কমিটি",b:"আদালত থেকে এক আসামি পালিয়ে যাওয়ার ঘটনায় একজন পুলিশ সদস্যকে বরখাস্ত করা হয়েছে এবং ঘটনা তদন্তে কমিটি গঠন করা হয়েছে।",s:"",l:"বাংলাদেশ",tg:["আসামি","আদালত","বরখাস্ত"],p:3,tr:0,m:"৬ অক্টোবর",et:"Police officer suspended after accused escapes from court; probe committee formed",eb:"A police officer has been suspended over the escape of an accused from court, and a committee has been formed to investigate."},
{c:"মিডিয়াপাড়া",e:"🎬",t:"ওয়ার্নার ব্রাদার্সের মালিকানা নিল প্যারামাউন্ট",b:"প্রতিবেদন অনুযায়ী ১১০ বিলিয়ন ডলারে ওয়ার্নার ব্রাদার্স ডিসকভারির নিয়ন্ত্রণ নিয়েছে প্যারামাউন্ট স্কাইড্যান্স। একীভূতকরণে এইচবিও, সিবিএস, নিকেলোডিয়ন, শোটাইম, কমেডি সেন্ট্রাল, ডিসি স্টুডিওস ও ফুড নেটওয়ার্কের মতো ব্র্যান্ড একই ছাতার নিচে আসছে। সিএনএনের ভবিষ্যৎ নিয়েও অনিশ্চয়তা তৈরি হয়েছে। বিশ্লেষকদের মতে, এটি হলিউডের স্টুডিও ব্যবসা, স্ট্রিমিং বাজার ও গণমাধ্যম প্রতিযোগিতার কাঠামোয় প্রভাব ফেলতে পারে।",s:"",l:"লস অ্যাঞ্জেলেস",tg:["হলিউড","প্যারামাউন্ট","ওয়ার্নার ব্রাদার্স"],p:3,tr:0,m:"আজ",et:"Paramount takes ownership of Warner Bros.",eb:"According to reports, Paramount Skydance has taken control of Warner Bros. Discovery in a $110 billion deal. The merger brings brands such as HBO, CBS, Nickelodeon, Showtime, Comedy Central, DC Studios and Food Network under one roof, and CNN's future has also become uncertain. Analysts say it could reshape Hollywood's studio business, the streaming market and media competition."},
{c:"বিনোদন",e:"🎞️",t:"মহাসংকটে চলচ্চিত্র: প্রযোজক খুঁজে বেড়াচ্ছেন পরিচালকেরা",b:"আগে প্রযোজক পরিচালকের কাছে আসতেন, এখন পরিচালককে প্রযোজক খুঁজে বেড়াতে হয়। প্রযোজকেরা একটি ছবি করার পর নতুন বিনিয়োগে আগ্রহ দেখান না, কারণ লগ্নি করা অর্থ ফেরত আসে না।",s:"",l:"ঢাকা",tg:["চলচ্চিত্র","প্রযোজক","বিনিয়োগ"],p:4,tr:0,m:"৭ অক্টোবর",et:"Film industry in deep crisis: directors now search for producers",eb:"Producers used to approach directors; now directors have to hunt for producers. After making one film, producers are reluctant to invest again because the money put in does not come back."},

{c:"অপরাধ",e:"🚨",t:"কেএনএফ প্রধানসহ ৯ জনের বিরুদ্ধে মানিলন্ডারিং মামলা করল সিআইডি",b:"নিষিদ্ধ সংগঠন কুকি-চিন ন্যাশনাল ফ্রন্টের (কেএনএফ) ইউনিফর্ম তৈরিতে অর্থায়নের অভিযোগে সংগঠনটির প্রধান নাথান বমসহ ৯ জনের বিরুদ্ধে মানিলন্ডারিং প্রতিরোধ আইনে মামলা করেছে পুলিশের অপরাধ তদন্ত বিভাগ (সিআইডি)। আজ বৃহস্পতিবার সিআইডি বিষয়টি নিশ্চিত করেছে।",s:"",l:"বাংলাদেশ",tg:["কেএনএফ","সিআইডি","মানিলন্ডারিং"],p:1,br:1,tr:0,m:"আজ",et:"CID files money-laundering case against KNF chief and 8 others",eb:"Police's Criminal Investigation Department (CID) has filed a case under the Money Laundering Prevention Act against 9 people, including Kuki-Chin National Front (KNF) chief Nathan Bom, over allegedly financing the making of uniforms for the banned group. CID confirmed it on Thursday."},
{c:"জাতীয়",e:"🚇",t:"ঢাকার গণপরিবহন ব্যবস্থাপনা নিয়ে প্রধানমন্ত্রীর সভাপতিত্বে বৈঠক",b:"ঢাকা মহানগরের গণপরিবহন ব্যবস্থাপনা নিয়ে আজ বৃহস্পতিবার সকালে সচিবালয়ের মন্ত্রিপরিষদ বিভাগে প্রধানমন্ত্রী তারেক রহমানের সভাপতিত্বে বৈঠক শুরু হয়।",s:"",l:"ঢাকা",tg:["গণপরিবহন","প্রধানমন্ত্রী","ঢাকা"],p:1,br:1,tr:0,m:"আজ, ১৩:০১",ts:781,et:"PM chairs meeting on Dhaka's public transport management",eb:"A meeting on public transport management in Dhaka metropolitan area began this Thursday morning at the Cabinet Division of the Secretariat, chaired by Prime Minister Tarique Rahman."},
{c:"আন্তর্জাতিক",e:"🚨",t:"সৌদি আরবের দুটি বিমানবন্দরে হামলা, নিহত ৩, আহত ৩৬",b:"সৌদি আরবের দুটি বিমানবন্দরে হামলায় নারীসহ তিন বিদেশি নিহত এবং ৩৬ জন আহত হয়েছেন বলে খবর পাওয়া গেছে। একটি প্রতিবেদন অনুযায়ী হামলাটি চালিয়েছে হুথিরা।",s:"",l:"সৌদি আরব",tg:["সৌদি আরব","বিমানবন্দর","হামলা"],p:1,br:1,tr:0,m:"আজ, ০৭:৫০",ts:470,et:"Attacks on two Saudi airports kill 3, injure 36",eb:"Three foreigners, including a woman, were killed and 36 people injured in attacks on two airports in Saudi Arabia, according to reports. One report says the attacks were carried out by the Houthis."},
{c:"ব্যাংক",e:"🏦",t:"ন্যাশনাল ব্যাংকের গ্রাহকরা ১৫ অক্টোবর থেকে চাহিদা অনুযায়ী টাকা তুলতে পারবেন",b:"আগামী ১৫ অক্টোবর থেকে ন্যাশনাল ব্যাংক পিএলসির গ্রাহকরা চাহিদা অনুযায়ী আমানতের টাকা তুলতে পারবেন। এজন্য ব্যাংকটির সব শাখা ও এটিএম বুথে প্রয়োজনীয় নগদ অর্থ সরবরাহ নিশ্চিত করার নির্দেশ দিয়েছেন বাংলাদেশ ব্যাংকের গভর্নর। আজ ব্যাংকের চেয়ারম্যান ও ভারপ্রাপ্ত ব্যবস্থাপনা পরিচালকের সঙ্গে সাক্ষাতে তিনি এ নির্দেশনা দেন।",s:"",l:"ঢাকা",tg:["ন্যাশনাল ব্যাংক","বাংলাদেশ ব্যাংক","আমানত"],p:1,br:1,tr:0,m:"আজ, ১৩:৪৬",ts:826,et:"National Bank customers to be able to withdraw deposits on demand from 15 October",eb:"From 15 October, customers of National Bank PLC will be able to withdraw their deposits as needed. The Bangladesh Bank governor has directed that sufficient cash be supplied to all branches and ATM booths. He gave the instruction today during a meeting with the bank's chairman and acting managing director."},
{c:"আন্তর্জাতিক",e:"🌐",t:"রাশিয়ার ক্ষেপণাস্ত্র হামলায় ইউক্রেনে নিহত ২৮",b:"রাশিয়ার ক্ষেপণাস্ত্র হামলায় ইউক্রেনে ২৮ জন নিহত হয়েছেন বলে খবর পাওয়া গেছে।",s:"",l:"ইউক্রেন",tg:["ইউক্রেন","রাশিয়া","হামলা"],p:2,tr:0,m:"আজ, ০৮:১১",ts:491,et:"28 killed in Russian missile attack on Ukraine",eb:"Twenty-eight people were reported killed in a Russian missile attack on Ukraine."},

{c:"দুর্ঘটনা",e:"🚧",t:"ধামরাইয়ে মুখোমুখি সংঘর্ষে কাভার্ডভ্যান দুমড়েমুচড়ে, চালক নিহত",b:"ঢাকার ধামরাইয়ে মুখোমুখি সংঘর্ষে একটি কাভার্ডভ্যান দুমড়েমুচড়ে গেছে এবং এর চালক নিহত হয়েছেন।",s:"",l:"ধামরাই, ঢাকা",d:"ঢাকা",v:"ঢাকা",tg:["ধামরাই","সড়ক দুর্ঘটনা","কাভার্ডভ্যান"],p:3,tr:0,m:"আজ",et:"Covered van mangled in head-on collision in Dhamrai; driver killed",eb:"A covered van was crushed in a head-on collision in Dhamrai, Dhaka, and its driver was killed."},
{c:"রাজনীতি",e:"🏛️",t:"ধর্ম-বর্ণ নির্বিশেষে সবার কল্যাণে সরকার কাজ করছে: প্রধানমন্ত্রী",b:"প্রধানমন্ত্রী তারেক রহমান জানিয়েছেন, ধর্ম, বর্ণ, শ্রেণি-পেশা ও সম্প্রদায় নির্বিশেষে দেশের প্রতিটি নাগরিকের কল্যাণে সরকার কাজ করে যাচ্ছে। বুধবার বিকেলে সচিবালয়ে প্রধানমন্ত্রীর কার্যালয়ে হিন্দু ও বৌদ্ধ সম্প্রদায়ের প্রতিনিধিদের সঙ্গে মতবিনিময় সভায় তিনি কথা বলেন। সভায় হিন্দু ও বৌদ্ধধর্মীয় কল্যাণ ট্রাস্টের প্রতিনিধিদের হাতে অনুদানের চেক হস্তান্তর করেন প্রধানমন্ত্রী। তিনি জানান, ধর্ম, বর্ণ ও পরিচয় অধিকার ও সুযোগের ক্ষেত্রে বাধা হবে না.",s:"",l:"ঢাকা",tg:["প্রধানমন্ত্রী","সরকার","নাগরিক"],p:1,br:1,tr:0,m:"আজ",et:"Government working for welfare of all regardless of religion: PM",eb:"Prime Minister Tarique Rahman said the government is working for the welfare of every citizen of the country regardless of religion, caste, class, profession or community. On Wednesday afternoon he spoke at a views-exchange meeting with representatives of the Hindu and Buddhist communities at the PM's Office in the Secretariat, where he handed over donation cheques to representatives of the Hindu and Buddhist religious welfare trusts. He said religion, caste and identity will not be a barrier to rights and opportunities."},

{c:"রাজনীতি",e:"🟢",t:"শৃঙ্খলা ভঙ্গের অভিযোগে মৌলভীবাজারে এনসিপির ২ নেতাকে বহিষ্কার",b:"সাংগঠনিক শৃঙ্খলা ভঙ্গ ও সংগঠনের নীতিবিরোধী কার্যকলাপের অভিযোগে জাতীয় নাগরিক পার্টির (এনসিপি) মৌলভীবাজার জেলা আহ্বায়ক কমিটির সিনিয়র যুগ্ম আহ্বায়কসহ দুই নেতাকে বহিষ্কার করা হয়েছে। দলের আহ্বায়ক নাহিদ ইসলাম ও সদস্যসচিব আখতার হোসেনের নির্দেশে গঠনতন্ত্র ও শৃঙ্খলা বিধি অনুযায়ী প্রাথমিক সদস্যপদসহ সব পদ ও দায়িত্ব থেকে তাঁদের বহিষ্কার করা হয়।",s:"",l:"মৌলভীবাজার",d:"মৌলভীবাজার",v:"সিলেট",tg:["এনসিপি","মৌলভীবাজার","বহিষ্কার"],p:1,br:1,tr:0,m:"৭ অক্টোবর",et:"NCP expels two leaders in Moulvibazar over alleged breach of discipline",eb:"The National Citizen Party (NCP) has expelled two leaders, including the senior joint convener of its Moulvibazar district convening committee, over alleged breaches of organisational discipline and activities against the party's policy. On the instruction of convener Nahid Islam and member secretary Akhtar Hossain, they were removed from primary membership and all posts and responsibilities in line with the party constitution and disciplinary rules."},
{c:"রাজনীতি",e:"🔵",t:"সনাতন ধর্মাবলম্বীদের ভোটেই তারেক রহমান প্রধানমন্ত্রী হয়েছেন: বরকত উল্লাহ বুলু",b:"বিএনপির ভাইস চেয়ারম্যান ও নোয়াখালী-৩ আসনের সংসদ সদস্য বরকত উল্লাহ বুলু মন্তব্য করেছেন, বাংলাদেশের সনাতন ধর্মাবলম্বীদের ভোটেই তারেক রহমান প্রধানমন্ত্রী হয়েছেন। এটি তাঁর নিজস্ব মন্তব্য।",s:"",l:"নোয়াখালী",d:"নোয়াখালী",v:"চট্টগ্রাম",tg:["বিএনপি","বরকত উল্লাহ বুলু","নোয়াখালী"],p:1,br:1,tr:0,m:"৭ অক্টোবর, ১৯:৫৭",et:"Hindu votes made Tarique Rahman prime minister: BNP's Barkat Ullah Bulu",eb:"BNP vice chairman and Noakhali-3 MP Barkat Ullah Bulu remarked that Tarique Rahman became prime minister through the votes of Bangladesh's Sanatani (Hindu) community. This is his own remark."},
{c:"রাজনীতি",e:"🔵",t:"সড়কে মাফিয়াতন্ত্রের অবসান ঘটাতে হবে: রিজভী",b:"বিএনপি নেতা রিজভী বলেছেন, সড়ক পরিবহন খাতে দীর্ঘদিনের নৈরাজ্য, চাঁদাবাজি ও সিন্ডিকেটের অবসান ঘটাতে হবে।",s:"",l:"ঢাকা",tg:["বিএনপি","রিজভী","সড়ক পরিবহন"],p:1,br:1,tr:0,m:"আজ, ১১:১৯",ts:679,et:"Road mafia rule must end: Rizvi",eb:"BNP leader Rizvi said the long-standing anarchy, extortion and syndicates in the road transport sector must be brought to an end."},
{c:"রাজনীতি",e:"🟥",t:"ফুলপুরে ছাত্রদলের বিক্ষোভ মিছিল: নিষিদ্ধ আওয়ামী লীগের ‘ষড়যন্ত্রের’ প্রতিবাদ",b:"ময়মনসিংহের ফুলপুরে কার্যক্রম নিষিদ্ধ আওয়ামী লীগ ও তার সহযোগী সংগঠনের কথিত নৈরাজ্য, বিশৃঙ্খলা ও ষড়যন্ত্রের প্রতিবাদে বিক্ষোভ মিছিল ও প্রতিবাদ সমাবেশ করেছে ছাত্রদল। নেতারা অভিযোগ করেন, আওয়ামী লীগ দেশের শান্তিপূর্ণ পরিবেশ বিঘ্নিত করার চেষ্টা করছে। এগুলো ছাত্রদল নেতাদের বক্তব্য।",s:"",l:"ফুলপুর, ময়মনসিংহ",d:"ময়মনসিংহ",v:"ময়মনসিংহ",tg:["আওয়ামী লীগ","ছাত্রদল","ফুলপুর"],p:1,br:1,tr:0,m:"৭ অক্টোবর, ১৭:৩৮",et:"Chhatra Dal rally in Phulpur against alleged conspiracy by banned Awami League",eb:"Chhatra Dal held a protest rally and procession in Phulpur, Mymensingh, against what it called anarchy, disorder and conspiracy by the Awami League, whose activities are banned, and its affiliates. Leaders alleged the party is trying to disturb the country's peaceful environment; these are the Chhatra Dal leaders' claims."},
{c:"রাজনীতি",e:"🟥",t:"দুর্গোৎসব ঘিরে আওয়ামী লীগ ভারতে বসে ষড়যন্ত্র করছে, দাবি রাশেদ খাঁনের",b:"দুর্গোৎসবকে ঘিরে আওয়ামী লীগ ভারতে বসে ষড়যন্ত্র করছে বলে দাবি করেছেন রাশেদ খাঁন। এটি তাঁর দাবি; স্বাধীনভাবে যাচাই করা হয়নি।",s:"",l:"বাংলাদেশ",tg:["আওয়ামী লীগ","দুর্গোৎসব","রাশেদ খাঁন"],p:1,br:1,tr:0,m:"আজ",et:"Awami League conspiring from India around Durga Puja, claims Rashed Khan",eb:"Rashed Khan has claimed that the Awami League is conspiring from India around the Durga festival. It is his claim and has not been independently verified."},
{c:"আইন ও আদালত",e:"⚖️",t:"চাঁপাইনবাবগঞ্জে বিএনপিকর্মী আহাদ আলী হত্যা মামলা: চার্জশিটে নারাজি, সিআইডিকে তদন্তের নির্দেশ",b:"চাঁপাইনবাবগঞ্জে বিএনপিকর্মী আহাদ আলী হত্যা মামলায় পুলিশ আগে এজাহারভুক্ত পাঁচ আসামিকে অব্যাহতির সুপারিশ করে চার্জশিট দিয়েছিল। মামলার বাদী তাতে নারাজি দিলে আদালত মামলাটি সিআইডিকে তদন্তের নির্দেশ দিয়েছেন।",s:"",l:"চাঁপাইনবাবগঞ্জ",d:"চাঁপাইনবাবগঞ্জ",v:"রাজশাহী",tg:["বিএনপি","আওয়ামী লীগ","হত্যা মামলা","সিআইডি"],p:2,br:1,tr:0,m:"৭ অক্টোবর, ১৭:৪৫",et:"Chapainawabganj BNP worker Ahad Ali murder case: objection to police charge sheet, CID ordered to investigate",eb:"Police had earlier submitted a charge sheet recommending the discharge of five accused named in the complaint in the murder case of BNP worker Ahad Ali in Chapainawabganj. After the complainant objected, the court ordered the CID to investigate."},
{c:"শিক্ষাব্যবস্থা",e:"🏫",t:"২০২৭ সাল থেকে চতুর্থ শ্রেণি থেকেই কারিকুলামে খেলাধুলা, সংস্কৃতি ও নৈতিক শিক্ষা",b:"শিক্ষামন্ত্রী আ ন ম এহছানুল হক মিলন জানিয়েছেন, ২০২৭ সাল থেকে চতুর্থ শ্রেণি থেকে কারিকুলামে খেলাধুলা, সংস্কৃতি এবং নৈতিক ও মানবিক মূল্যবোধ অন্তর্ভুক্ত করা হয়েছে। শিক্ষা বোর্ডের ব্যবস্থাপনায় ৫৩তম আঞ্চলিক গ্রীষ্মকালীন ক্রীড়া প্রতিযোগিতার শুভ উদ্বোধনকালে তিনি শিক্ষার্থীদের শুধু পাঠ্যপুস্তকে সীমাবদ্ধ না থেকে খেলাধুলা ও নৈতিক শিক্ষার মাধ্যমে মেধা বিকাশের আহ্বান জানান।",s:"",l:"বাংলাদেশ",tg:["শিক্ষামন্ত্রী","কারিকুলাম","খেলাধুলা"],p:3,tr:0,m:"৬ অক্টোবর",et:"From 2027, sports, culture and moral education in curriculum from class four",eb:"Education Minister A N M Ehsanul Hoque Milon said that from 2027 sports, culture and moral and human values have been included in the curriculum from class four. Inaugurating the 53rd regional summer sports competition run by the education board, he urged students not to limit themselves to textbooks but to develop their talent through sports and moral education."},
{c:"ইউটিউব ট্রেন্ডিং",e:"▶️",t:"২৩ ঘণ্টায় ৪৭ লাখ ভিউ: শুরুতেই চমক নাটক ‘ফিরে আসার গল্প’",b:"মুহাম্মদ মোস্তফা কামাল রাজের রচনা ও পরিচালনায় নতুন ধারাবাহিক নাটক ‘ফিরে আসার গল্প’-এর প্রথম পর্ব বুধবার (৭ অক্টোবর) দুপুর ১২টায় চ্যানেল আই ও সিনেমাওয়ালা ইউটিউব চ্যানেলে মুক্তি পেয়েছে। প্রচারের ৩ ঘণ্টা ৩৭ মিনিটের মধ্যে নাটকটি এক মিলিয়ন ভিউ পেরিয়েছে এবং মুক্তির ২৩ ঘণ্টায় ভিউ ৪৭ লাখের বেশি। সম্পর্কের ও পারিবারিক গল্প নিয়ে তৈরি এই নাটক ‘এটা আমাদেরই গল্প’-এর পর নির্মাতার নতুন কাজ।",s:"",l:"বাংলাদেশ",tg:["ইউটিউব","নাটক","ফিরে আসার গল্প"],p:2,tr:1,m:"৮ অক্টোবর",et:"4.7 million views in 23 hours: new drama serial 'Phire Asar Golpo' starts with a bang",eb:"The first episode of the new serial 'Phire Asar Golpo', written and directed by Mohammad Mostafa Kamal Raz, was released at noon on Wednesday, 7 October on the Channel i and Cinemawala YouTube channels. It crossed one million views within 3 hours 37 minutes and more than 4.7 million views within 23 hours of release. The story is built around relationships and family, and follows the maker's earlier work 'Eta Amaderi Golpo'."},
{c:"সেলিব্রেটি",e:"⭐",t:"মেসির বিদায়ে আবেগি পোস্ট দিলেন পূর্ণিমা, পরীমনিসহ বাংলাদেশি তারকারা",b:"আর্জেন্টাইন তারকা ফুটবলার লিওনেল মেসির বিদায়ে অভিনেত্রী পূর্ণিমা, পরীমনিসহ বাংলাদেশের অনেক তারকা আবেগি পোস্ট দিয়েছেন।",s:"",l:"বাংলাদেশ",tg:["সেলিব্রেটি","মেসি","পূর্ণিমা","পরীমনি"],p:3,tr:0,m:"৮ অক্টোবর",et:"Purnima, Porimoni and other Bangladeshi stars post emotional farewells to Messi",eb:"Actress Purnima, Porimoni and many other Bangladeshi stars have shared emotional posts on the departure of Argentine football star Lionel Messi."},
{c:"সোশ্যাল মিডিয়া",e:"📱",t:"ইংরেজি শেখানোর ভিডিওতে ভাইরাল কৃষাণী যশোদা, প্রিয়াঙ্কা চোপড়ার নজরে",b:"গ্রামের কৃষাণী যশোদা ‘ইংলিশ উইথ দেহাতি ম্যাডাম’ নামে সহজ ইংরেজি শেখানোর ভিডিও প্রকাশ করেন, যা মূলত গ্রাম ও হিন্দিভাষী মানুষের জন্য। মাঠে কাজের ফাঁকে ইংরেজিতে ধারণ করা তাঁর একটি ভিডিও ছড়িয়ে পড়ার পর অভিনেত্রী প্রিয়াঙ্কা চোপড়া সেটি নিজের ইনস্টাগ্রাম স্টোরিতে শেয়ার করেন। দ্বাদশ শ্রেণি পর্যন্ত পড়াশোনা করা যশোদার ইনস্টাগ্রামে এখন ৫ লাখ ৮০ হাজারের বেশি অনুসারী।",s:"",l:"ভারত",tg:["ভাইরাল","ইনস্টাগ্রাম","প্রিয়াঙ্কা চোপড়া"],p:3,tr:0,m:"৭ অক্টোবর, ২০:০৮",et:"Farm woman Yashoda goes viral with English-teaching videos, noticed by Priyanka Chopra",eb:"Farmer Yashoda posts simple English-teaching videos under the name 'English with Dehati Madam', mainly for rural and Hindi-speaking people. After a video she shot in English between farm work spread online, actress Priyanka Chopra shared it on her Instagram story. Yashoda, who studied up to class 12, now has over 580,000 Instagram followers."},
{c:"খেলাধুলা",e:"⚽",t:"মেসির বিদায়ী ম্যাচ: মনুমেন্তালে অশ্রুসিক্ত আর্জেন্টিনা",b:"লিওনেল মেসি আনুষ্ঠানিকভাবে আর্জেন্টিনা জাতীয় দলকে বিদায় জানিয়েছেন। বুয়েনস আইরেসের মনুমেন্তাল স্টেডিয়ামে ৬ অক্টোবর বেনিনের বিপক্ষে বিদায়ী ম্যাচে জাতীয় দলের জার্সিতে শেষবার মাঠে নামেন তিনি; গ্যালারিজুড়ে ধ্বনিত হয় ‘মেসি…মেসি…মেসি…’। কোচ স্কালোনি কাঁদতে কাঁদতে বলেছেন, মেসি নেই, এই শূন্যতা পূরণের নয়। একটি প্রতিবেদনের শিরোনাম অনুযায়ী তিনি গোল ও জোড়া অ্যাসিস্টে দলকে জিতিয়ে বিদায় রাঙিয়েছেন।",s:"",l:"আর্জেন্টিনা",tg:["মেসি","আর্জেন্টিনা","বিদায়ী ম্যাচ"],p:2,tr:1,m:"৭ অক্টোবর",et:"Messi's farewell match: Argentina in tears at the Monumental",eb:"Lionel Messi has formally bid farewell to the Argentina national team. He played his last match in the national shirt against Benin at Buenos Aires' Monumental stadium on 6 October, with the stands chanting 'Messi, Messi, Messi'. Coach Scaloni said, in tears, that Messi's absence leaves a void that cannot be filled. According to one report's headline, he signed off by winning the game for Argentina with a goal and two assists."},
{c:"খেলাধুলা",e:"🔟",t:"মেসির পর আর্জেন্টিনার ১০ নম্বর জার্সি কে পাচ্ছেন?",b:"মেসির বিদায়ের পর আর্জেন্টিনার ১০ নম্বর জার্সি কে পাবেন, তা নিয়ে আলোচনা চলছে বলে একটি প্রতিবেদনের শিরোনামে জানা গেছে।",s:"",l:"আর্জেন্টিনা",tg:["আর্জেন্টিনা","১০ নম্বর জার্সি","মেসি"],p:4,tr:0,m:"৮ অক্টোবর",et:"Who will get Argentina's number 10 shirt after Messi?",eb:"A report's headline asks who will inherit Argentina's number 10 shirt after Messi's departure."},
{c:"স্বাস্থ্য",e:"🦟",t:"ডেঙ্গুতে ২৪ ঘণ্টায় ৮ জনের মৃত্যু, হাসপাতালে ভর্তি ১,৮৬০",b:"স্বাস্থ্য অধিদপ্তরের বুধবারের (৭ অক্টোবর) বুলেটিন অনুযায়ী গত ২৪ ঘণ্টায় ডেঙ্গুতে ৮ জনের মৃত্যু হয়েছে এবং ১ হাজার ৮৬০ জন হাসপাতালে ভর্তি হয়েছেন। সবচেয়ে বেশি রোগী ভর্তি হয়েছেন খুলনা বিভাগে (৩৭৬ জন)। চলতি বছর ডেঙ্গুতে হাসপাতালে ভর্তির সংখ্যা প্রায় ৯২ হাজার, আর মৃত্যু ২৮১ থেকে ২৮৯ জন (প্রতিবেদনভেদে সামান্য পার্থক্য আছে)। সেপ্টেম্বরে সবচেয়ে বেশি, ৪৩ হাজার ৭৭৪ জন ভর্তি ও ১৪৮ জনের মৃত্যু হয়েছে।",s:"",l:"বাংলাদেশ",tg:["ডেঙ্গু","স্বাস্থ্য অধিদপ্তর","হাসপাতাল"],p:1,br:1,tr:1,m:"আজ, ০৭:৪৭",ts:467,et:"Dengue: 8 deaths in 24 hours, 1,860 hospitalised",eb:"According to the Directorate General of Health Services bulletin of Wednesday (7 October), 8 people died of dengue and 1,860 were hospitalised in the past 24 hours. Khulna division saw the most admissions (376). This year about 92,000 people have been hospitalised and 281 to 289 have died (reports differ slightly). September had the highest toll: 43,774 admissions and 148 deaths."},
{c:"স্বাস্থ্য",e:"🩺",t:"হাম ও হামের উপসর্গে ২৪ ঘণ্টায় ৪ জনের মৃত্যু",b:"স্বাস্থ্য অধিদপ্তরের হেলথ ইমার্জেন্সি অপারেশন সেন্টার ও কন্ট্রোলরুমের বিজ্ঞপ্তি অনুযায়ী গত ২৪ ঘণ্টায় হামে দুজন এবং হামের উপসর্গে দুজন, মোট চারজনের মৃত্যু হয়েছে।",s:"",l:"বাংলাদেশ",tg:["হাম","স্বাস্থ্য অধিদপ্তর"],p:2,tr:0,m:"আজ, ০৭:৪৭",et:"4 deaths from measles and measles symptoms in 24 hours",eb:"According to the Health Emergency Operation Centre and Control Room of the health directorate, four people died in the past 24 hours: two from measles and two with measles symptoms."},

{c:"ব্যাংক",e:"🚗",t:"বিওয়াইডি গাড়ি কিনলে ঋণ সুবিধা: সাউথইস্ট ব্যাংকের সমঝোতা",b:"সাউথইস্ট ব্যাংক পিএলসি বিওয়াইডি বাংলাদেশের প্রতিনিধি সিজি রানার বিডি লিমিটেডের সঙ্গে সমঝোতা স্মারক সই করেছে, যাতে নতুন বিওয়াইডি গাড়ি কেনা গ্রাহকরা আকর্ষণীয় ঋণ সুবিধা পান।",s:"",l:"ঢাকা",tg:["সাউথইস্ট ব্যাংক","বিওয়াইডি","ঋণ"],p:4,tr:0,m:"৬ অক্টোবর",et:"Loan benefits on BYD car purchases: Southeast Bank signs MoU",eb:"Southeast Bank PLC has signed a memorandum of understanding with CG Runner BD Ltd, representing BYD Bangladesh, so that customers buying brand-new BYD cars get attractive financing facilities."},
{c:"ইসলামিক",e:"🕌",t:"আজকের নামাজের সময়সূচি: ঢাকা ও আশপাশ",b:"ইসলামিক ফাউন্ডেশনের তথ্য অনুযায়ী ৮ অক্টোবর ঢাকা ও আশপাশের নামাজের সময়: ফজর ভোর ৪টা ৩৯ মিনিট, জোহর ১১টা ৫০ মিনিট, আসর বিকেল ৪টা ২ মিনিট, মাগরিব সন্ধ্যা ৫টা ৪৪ মিনিট, ইশা রাত ৬টা ৫৭ মিনিট। বিভাগীয় শহরের জন্য ঢাকার সময় থেকে চট্টগ্রামে ৫ মিনিট ও সিলেটে ৬ মিনিট বিয়োগ এবং খুলনায় ৩, রাজশাহীতে ৭, রংপুরে ৮ ও বরিশালে ১ মিনিট যোগ করতে হবে। সূত্রভেদে এক-দুই মিনিটের পার্থক্য থাকতে পারে।",s:"",l:"ঢাকা",tg:["নামাজের সময়","ইসলামিক ফাউন্ডেশন","ঢাকা"],p:3,tr:1,m:"আজ",et:"Today's prayer times: Dhaka and surrounding areas",eb:"According to the Islamic Foundation, prayer times for Dhaka and surrounding areas on 8 October: Fajr 4:39am, Dhuhr 11:50am, Asr 4:02pm, Maghrib 5:44pm, Isha 6:57pm. For divisional cities, subtract 5 minutes for Chattogram and 6 for Sylhet from Dhaka's time, and add 3 for Khulna, 7 for Rajshahi, 8 for Rangpur and 1 for Barishal. Times may differ by a minute or two between sources."},
{c:"কৃষি",e:"🌾",t:"উত্তরাঞ্চলে আগাম আমন কাটা শুরু, বন্যার প্রভাব কম থাকায় ফলন আশানুরূপ",b:"রংপুর আঞ্চলিক কৃষি সম্প্রসারণ অধিদপ্তরের অতিরিক্ত পরিচালক আবু বকর সাইফুল ইসলাম জানিয়েছেন, উঁচু জমিতে লাগানো আগাম জাতের আমন ধান কাটা শুরু হয়েছে এবং অক্টোবরের মাঝামাঝি পর্যন্ত চলবে; মৌসুমের মূল আমন কাটা শুরু হবে নভেম্বরের শুরুতে। এ বছর বন্যার প্রভাব কম থাকায় আগাম আমনের উৎপাদন আশানুরূপ হয়েছে। আগাম আমন চাষ হয়েছে ৩৩ হাজার হেক্টর জমিতে।",s:"",l:"উত্তরাঞ্চল",tg:["আমন ধান","রংপুর","কৃষি"],p:3,tr:0,m:"৬ অক্টোবর",et:"Early Aman harvest begins in the north; yields as expected with less flood impact",eb:"Abu Bakar Saiful Islam, additional director of the Rangpur regional agriculture extension department, said harvesting of early-variety Aman on high land has begun and will continue until mid-October; the main Aman harvest begins in early November. With less flood impact this year, early Aman output has met expectations. Early Aman was grown on 33,000 hectares."},
{c:"কৃষি",e:"🌿",t:"খুলনা অঞ্চলে রোপা আমন চাষে ভালো ফলনের আশা, কৃষকের মুখে হাসি",b:"খুলনা, বাগেরহাট, সাতক্ষীরা ও নড়াইল—এই চার জেলায় চলতি মৌসুমে ২ লাখ ৯৯ হাজার ৮৫৯ হেক্টর জমিতে আমন চাষের লক্ষ্যমাত্রা ছিল। খুলনা জেলায় ৮৮ হাজার ৩৫১ হেক্টরের লক্ষ্যমাত্রার বিপরীতে ৮৭ হাজার ৪৬৯ হেক্টরে রোপা আমনের আবাদ হয়েছে। অনুকূল আবহাওয়া ও খাল পুনঃখনন কর্মসূচির ফলে ধান ও চালের ভালো উৎপাদনে কৃষকেরা খুশি।",s:"",l:"খুলনা অঞ্চল",d:"খুলনা",v:"খুলনা",tg:["আমন ধান","খুলনা","কৃষক"],p:3,tr:0,m:"৬ অক্টোবর",et:"Good Aman yields expected in Khulna region, farmers smiling",eb:"In the four districts of Khulna, Bagerhat, Satkhira and Narail, the target this season was to cultivate Aman on 299,859 hectares. In Khulna district, Aman was planted on 87,469 hectares against a target of 88,351. Favourable weather and a canal re-excavation programme have farmers happy about good rice output."},
{c:"কৃষি",e:"😟",t:"আমন ধান চাষের খরচ ওঠা নিয়ে দুশ্চিন্তায় যশোরের কৃষক",b:"গত বছর এক বিঘা জমিতে আমন চাষে সব মিলিয়ে ১৫ থেকে ১৮ হাজার টাকা খরচ হয়েছিল; এবার তা বেড়েছে বলে কৃষকেরা জানাচ্ছেন। সরকার সারের যে দাম নির্ধারণ করেছে, বাজারে দাম তার চেয়ে বেশি বলে অভিযোগ কৃষকদের। যশোর জেলা কৃষি সম্প্রসারণ অধিদপ্তরের তথ্যমতে জেলায় এবার ১ লাখ ৩৩ হাজার হেক্টর জমিতে আমন চাষ হয়েছে।",s:"",l:"যশোর",d:"যশোর",v:"খুলনা",tg:["আমন ধান","সারের দাম","যশোর"],p:3,tr:0,m:"৪ অক্টোবর",et:"Jashore farmers worry about recovering Aman cultivation costs",eb:"Last year growing Aman on one bigha cost Tk 15,000 to 18,000 in all; farmers say it is higher this year. They complain that market prices of fertiliser are above the government-set rates. According to the Jashore district agriculture extension office, Aman has been grown on 133,000 hectares in the district this year."},
{c:"কৃষি",e:"🚜",t:"রাজবাড়ীতে যন্ত্রে ধান রোপণ, কমছে কৃষকের খরচ",b:"কৃষি সম্প্রসারণ অধিদপ্তরের সহযোগিতায় সিমিট ও সিজিআইএআর-এর ‘স্কেলিং ফর ইমপ্যাক্ট’ কর্মসূচির আওতায় রাজবাড়ীতে যান্ত্রিক পদ্ধতিতে ধান রোপণ হচ্ছে। শ্রমিক সংকট, শ্রমের মূল্যবৃদ্ধি ও সময়মতো চাষ সম্পন্নের প্রয়োজনে কৃষি যান্ত্রিকীকরণ গুরুত্বপূর্ণ বলে অধিদপ্তর জানিয়েছে।",s:"",l:"রাজবাড়ী",d:"রাজবাড়ী",v:"ঢাকা",tg:["যান্ত্রিকীকরণ","ধান রোপণ","রাজবাড়ী"],p:3,tr:0,m:"আজ",et:"Machine rice transplanting in Rajbari cuts farmers' costs",eb:"With the support of the Department of Agricultural Extension and under CIMMYT and CGIAR's 'Scaling for Impact' programme, rice is being transplanted by machine in Rajbari. The department says agricultural mechanisation is important because of labour shortages, rising labour costs and the need to finish cultivation on time."},
{c:"কৃষি",e:"🥬",t:"সিরাজগঞ্জে শীতের আগাম সবজিতে লাভবান কৃষক",b:"সিরাজগঞ্জে এবার আগাম শীতকালীন বিভিন্ন সবজি চাষে কৃষকেরা বাম্পার ফলনের আশা করছেন।",s:"",l:"সিরাজগঞ্জ",d:"সিরাজগঞ্জ",v:"রাজশাহী",tg:["শীতকালীন সবজি","সিরাজগঞ্জ","কৃষক"],p:4,tr:0,m:"৮ অক্টোবর",et:"Sirajganj farmers profit from early winter vegetables",eb:"Farmers in Sirajganj are hoping for bumper yields from early winter vegetables this year."},
{c:"গ্রামভিত্তিক",e:"🌾",t:"মজুরি নয়, খড়ের বিনিময়ে আগাম আমন কাটেন শ্রমিকেরা",b:"শিবগঞ্জ বাজার এলাকার কৃষক রেজাউল করিম দুই বিঘা জমিতে আগাম আমন চাষ করেছেন। ধান পেকে গেলে ২০ জন কৃষক-শ্রমিক এসে ধান কেটে, মাড়াই করে, বস্তায় ভরে বাড়িতে পৌঁছে দেন; মজুরির বদলে তাঁরা খড় নিয়ে যান। বাজারে প্রতি পণ (৮০ আঁটি) খড় ৬০০ থেকে ৭০০ টাকায় বিক্রি হচ্ছে। এতে কৃষকের শ্রমিক খরচ কমছে, গবাদিপশু পালনকারীরাও গোখাদ্য পাচ্ছেন।",s:"",l:"শিবগঞ্জ",tg:["খড়","আমন ধান","গ্রাম"],p:3,tr:0,m:"৭ অক্টোবর",et:"Paid in straw, not wages: workers harvest early Aman",eb:"Farmer Rezaul Karim near Shibganj bazar planted early Aman on two bigha of land. When the paddy ripened, 20 farmer-workers came, cut, threshed and bagged the rice and delivered it to his home; instead of wages they take away the straw. Straw sells for Tk 600 to 700 per pon (80 bundles) in the market. This lowers the farmer's labour cost, while livestock keepers also get fodder."},
{c:"গ্রামভিত্তিক",e:"🎣",t:"নওগাঁর মান্দায় লাখ টাকার অবৈধ চায়না জাল উদ্ধার ও পুড়িয়ে ছাই",b:"নওগাঁর মান্দায় অবৈধ চায়না জাল উদ্ধার করে পুড়িয়ে ফেলা হয়েছে; জালগুলোর মূল্য প্রায় লাখ টাকা বলে জানা গেছে।",s:"",l:"মান্দা, নওগাঁ",d:"নওগাঁ",v:"রাজশাহী",tg:["চায়না জাল","মান্দা","নওগাঁ"],p:4,tr:0,m:"৭ অক্টোবর",et:"Illegal Chinese nets worth about a lakh taka seized and burned in Manda, Naogaon",eb:"Illegal Chinese nets were seized and burned in Manda, Naogaon; the nets were reportedly worth around a lakh taka."},
{c:"গ্রামভিত্তিক",e:"🛂",t:"পঞ্চগড়ে পুশইনের চেষ্টা ঠেকিয়ে দিল বিজিবি",b:"পঞ্চগড়ে পুশইনের চেষ্টা ঠেকিয়ে দিয়েছে বিজিবি বলে খবর পাওয়া গেছে।",s:"",l:"পঞ্চগড়",d:"পঞ্চগড়",v:"রংপুর",tg:["পুশইন","বিজিবি","পঞ্চগড়"],p:3,tr:0,m:"৭ অক্টোবর",et:"BGB thwarts push-in attempt in Panchagarh",eb:"The BGB has reportedly thwarted an attempted push-in in Panchagarh."},
{c:"গ্রামভিত্তিক",e:"📍",t:"গোবিন্দগঞ্জে সীমানা নিয়ে বিরোধে হামলা, বৃদ্ধের মৃত্যু",b:"গাইবান্ধার গোবিন্দগঞ্জে সীমানা নিয়ে বিরোধের জেরে হামলার ঘটনায় এক বৃদ্ধের মৃত্যু হয়েছে বলে খবর পাওয়া গেছে।",s:"",l:"গোবিন্দগঞ্জ, গাইবান্ধা",d:"গাইবান্ধা",v:"রংপুর",tg:["সীমানা বিরোধ","গোবিন্দগঞ্জ","গাইবান্ধা"],p:3,tr:0,m:"৭ অক্টোবর",et:"Elderly man dies in attack over boundary dispute in Gobindaganj",eb:"An elderly man died in an attack stemming from a boundary dispute in Gobindaganj, Gaibandha, according to reports."},
{c:"আন্তর্জাতিক",e:"🏅",t:"রসায়নে নোবেল পেয়েছেন হেনরি বি কাগন ও কেনসো সোয়াই",b:"অপ্রতিসম জৈব সংশ্লেষণে অরৈখিক প্রভাব এবং স্ব-অনুঘটন আবিষ্কারের জন্য ২০২৬ সালে রসায়নে নোবেল পুরস্কার জিতেছেন হেনরি বি কাগন ও কেনসো সোয়াই। বুধবার (৭ অক্টোবর) রয়্যাল সুইডিশ একাডেমি এ ঘোষণা দেয়।",s:"",l:"সুইডেন",tg:["নোবেল","রসায়ন","২০২৬"],p:3,tr:0,m:"৭ অক্টোবর",et:"Henry B. Kagan and Kenso Soai win chemistry Nobel",eb:"Henry B. Kagan and Kenso Soai have won the 2026 Nobel Prize in Chemistry for discovering non-linear effects and autocatalysis in asymmetric organic synthesis. The Royal Swedish Academy announced it on Wednesday (7 October)."},
{c:"আন্তর্জাতিক",e:"🌍",t:"সৌদি নৌবাহিনী প্রধানের সঙ্গে মার্কিন নৌ কমান্ডারের বৈঠক",b:"সৌদি নৌবাহিনী প্রধানের সঙ্গে মার্কিন নৌ কমান্ডারের বৈঠক হয়েছে বলে বাংলাদেশ প্রতিদিনের শিরোনামে জানানো হয়েছে।",s:"",l:"সৌদি আরব",tg:["সৌদি আরব","যুক্তরাষ্ট্র","নৌবাহিনী"],p:4,tr:0,m:"আজ",et:"US naval commander meets Saudi navy chief",eb:"A report says a US naval commander met the chief of the Saudi navy."},

{c:"রাজনীতি",e:"🟢",t:"চাঁদপুরে নাসীরুদ্দীন পাটওয়ারীকে ‘অবাঞ্ছিত’ ঘোষণা বিএনপি ও অঙ্গসংগঠনের নেতাকর্মীদের",b:"এনসিপির মুখ্য সমন্বয়ক নাসীরুদ্দীন পাটওয়ারীকে তাঁর নিজ জেলা চাঁদপুরে অবাঞ্ছিত ঘোষণা করেছেন বিএনপি ও তার অঙ্গ-সহযোগী সংগঠনের নেতাকর্মীরা। বিএনপির শীর্ষ নেতাদের নিয়ে তাঁর ‘অশালীন বক্তব্যের’ অভিযোগ তুলে এ ঘোষণা দেওয়া হয়।",s:"যুগান্তর",l:"চাঁদপুর",tg:["এনসিপি","নাসীরুদ্দীন পাটওয়ারী","চাঁদপুর","বিএনপি"],p:1,br:1,tr:0,m:"২০ আগস্ট ২০২৬",et:"BNP activists declare NCP's Nasiruddin Patwary 'unwelcome' in Chandpur",eb:"BNP and affiliated activists declared NCP chief coordinator Nasiruddin Patwary unwelcome in his home district Chandpur over alleged indecent remarks about BNP leaders."},

{c:"রাজনীতি",e:"🚗",t:"বেনাপোলে নাসীরুদ্দীন পাটওয়ারীর গাড়িবহরে হামলা, আহত ৪ দাবি এনসিপির",b:"যশোরের বেনাপোল বাজারে এনসিপির মুখ্য সমন্বয়ক নাসীরুদ্দীন পাটওয়ারীর গাড়িবহরে হামলা হয়েছে। দলটির দাবি, হামলায় চারজন আহত হয়েছেন; পাটওয়ারীসহ অন্য নেতারা নিরাপদ। সীমান্তে পুশ-ইন ঘটনা সরেজমিনে দেখে ফেরার পথে এ ঘটনা ঘটে বলে তাঁর ফেসবুক পোস্টে জানানো হয়। হামলাকারীদের পরিচয় তাৎক্ষণিক জানা যায়নি।",s:"যুগান্তর",l:"বেনাপোল, যশোর",tg:["এনসিপি","নাসীরুদ্দীন পাটওয়ারী","বেনাপোল","পুশ-ইন"],p:2,br:1,tr:0,m:"৩ জুন ২০২৬",et:"Attack on Nasiruddin Patwary's motorcade at Benapole; NCP says 4 injured",eb:"NCP says four people were hurt when the convoy of chief coordinator Nasiruddin Patwary was attacked at Benapole in Jashore."},

{c:"রাজনীতি",e:"🤝",t:"এনসিপি নেতাদের মধ্যে দূরত্ব বা বোঝাপড়ার ঘাটতি নেই: নাসীরুদ্দীন পাটওয়ারী",b:"বাংলামোটরে রূপায়ন টাওয়ারে এনসিপির অস্থায়ী কার্যালয়ে সংবাদ সম্মেলনে তিনি বলেন, নেতাদের মধ্যে কোনো দূরত্ব নেই; আন্দোলন ও রাজনৈতিক পরিসর আলাদা।",s:"দ্য ডেইলি স্টার বাংলা",l:"ঢাকা",tg:["এনসিপি","নাসীরুদ্দীন পাটওয়ারী"],p:4,br:0,tr:0,m:"সংরক্ষিত খবর",et:"No distance among NCP leaders: Nasiruddin Patwary",eb:"Patwary said there is no distance or understanding gap among NCP leaders."},
{c:"জুলাই-২০২৪",e:"🕊️",t:"আবু সাঈদ হত্যা মামলার রায়: আন্তর্জাতিক অপরাধ ট্রাইব্যুনাল-২ এর ঘোষণা",b:"জুলাই গণ-অভ্যুত্থানের প্রথম শহীদ বেরোবি শিক্ষার্থী আবু সাঈদ হত্যায় মানবতাবিরোধী অপরাধের মামলার রায় ৯ এপ্রিল ২০২৬ ঘোষণা করে ট্রাইব্যুনাল-২। সাবেক উপাচার্য হাসিবুর রশীদসহ আসামি ছিলেন ৩০ জন। ২০২৪ সালের ১৬ জুলাই রংপুরে পুলিশের গুলিতে তিনি নিহত হন। পরে পূর্ণাঙ্গ রায় প্রকাশিত হয় এবং রায়ে অসন্তোষের কথা জানান পরিবারের সদস্য ও সহযোদ্ধারা।",s:"প্রথম আলো, ইত্তেফাক, বাংলাদেশ প্রতিদিন",l:"রংপুর",tg:["আবু সাঈদ","জুলাই","ট্রাইব্যুনাল","বেরোবি"],p:1,br:1,tr:0,m:"৯ এপ্রিল ২০২৬",et:"Abu Sayed murder verdict delivered by International Crimes Tribunal-2",eb:"The tribunal delivered its verdict on 9 April 2026 in the Abu Sayed case with 30 accused."},
{c:"জুলাই-২০২৪",e:"🕯️",t:"ওসমান হাদি হত্যা মামলা: অধিকতর তদন্ত প্রতিবেদন ১৮ বার পিছিয়ে ২০ আগস্ট",b:"ইনকিলাব মঞ্চের মুখপাত্র শরীফ ওসমান হাদিকে ২০২৫ সালের ১২ ডিসেম্বর ঢাকায় গুলি করা হয়; সিঙ্গাপুরে চিকিৎসাধীন অবস্থায় তাঁর মৃত্যু হয়। মামলার অধিকতর তদন্ত প্রতিবেদন দাখিলের তারিখ ১৫ জুলাই ২০২৬ আদালত ১৮ বারের মতো পিছিয়ে ২০ আগস্ট ধার্য করেন। এটি সর্বশেষ পাওয়া তথ্য; এরপর তারিখ বদলে থাকতে পারে।",s:"দেশ রূপান্তর, দ্য বিজনেস স্ট্যান্ডার্ড",l:"ঢাকা",tg:["ওসমান হাদি","ইনকিলাব মঞ্চ","জুলাই","তদন্ত"],p:1,br:1,tr:0,m:"১৫ জুলাই ২০২৬",et:"Hadi murder case: further probe report deferred 18th time",eb:"The court deferred the further investigation report in the Osman Hadi murder case to 20 August."},

{c:"জুলাই-২০২৪",e:"🏛️",t:"আবু সাঈদ হত্যা মামলার রায় ঘিরে প্রসিকিউশনের বক্তব্য: ‘অকাট্য প্রমাণ পেয়েছি’",b:"চিফ প্রসিকিউটর আমিনুল ইসলাম বলেছিলেন, আবু সাঈদ হত্যার বিষয়টি জাতিসংঘের রিপোর্টেও এসেছে এবং তদন্তে সন্দেহাতীত প্রমাণ মিলেছে। রায়ের আগে তিনি আশানুরূপ ফলের আশা প্রকাশ করেন।",s:"আইটিভি বিডি",l:"ঢাকা",tg:["আবু সাঈদ","প্রসিকিউশন","জুলাই"],p:3,br:0,tr:0,m:"৮ এপ্রিল ২০২৬",et:"Prosecution expects favourable verdict in Abu Sayed case",eb:"Chief Prosecutor said they found conclusive evidence."},
{c:"ধর্ম",e:"🤲",t:"কোরআনের আলোকে জীবন: ধৈর্য ও সংকটে আল্লাহর সঙ্গ (সূরা বাকারা ১৫৩)",b:"সূরা বাকারার ১৫৩ নম্বর আয়াতে মুমিনদের ধৈর্য ও নামাজের মাধ্যমে সাহায্য চাইতে বলা হয়েছে এবং জানানো হয়েছে, আল্লাহ ধৈর্যশীলদের সঙ্গে আছেন। প্রতিটি সংকটে এই আয়াত মানুষকে স্থির থাকার দিকনির্দেশনা দেয়।",s:"প্রথম আলো",l:"বাংলাদেশ",tg:["কোরআন","ধর্ম","ধৈর্য","সূরা বাকারা"],p:2,br:0,tr:0,m:"কোরআনের আলোকে জীবন",et:"Life in the light of the Quran: patience in hardship (2:153)",eb:"Surah Al-Baqarah 2:153 asks believers to seek help through patience and prayer, noting God is with the patient."},

{c:"জুলাই-২০২৪",e:"🕊️",t:"জুলাই হত্যাকাণ্ডে শেখ হাসিনাকে মৃত্যুদণ্ড দিলেন আন্তর্জাতিক অপরাধ ট্রাইব্যুনাল-১",b:"জুলাই গণ-অভ্যুত্থানের সময় মানবতাবিরোধী অপরাধের প্রথম মামলার রায়ে ১৭ নভেম্বর ২০২৫ শেখ হাসিনাকে মৃত্যুদণ্ড দেন ট্রাইব্যুনাল। পাঁচ অভিযোগের মধ্যে ছিল উসকানিমূলক বক্তব্যের পর হত্যাকাণ্ড, আবু সাঈদ হত্যা, চানখাঁরপুলে ছয়জনকে হত্যা এবং আশুলিয়ায় ছয়জনকে পুড়িয়ে হত্যা। হাসিনা ও সাবেক স্বরাষ্ট্রমন্ত্রী আসাদুজ্জামান খান পলাতক; রাজসাক্ষী সাবেক আইজিপি মামুন।",s:"প্রথম আলো, দেশ রূপান্তর, ইত্তেফাক",l:"ঢাকা",tg:["জুলাই","শেখ হাসিনা","ট্রাইব্যুনাল","ফ্যাসিস্ট","৫ আগস্ট","আবু সাঈদ","চানখাঁরপুল","আশুলিয়া"],p:1,br:1,tr:0,m:"১৭ নভেম্বর ২০২৫",et:"Tribunal sentences Sheikh Hasina to death over July killings",eb:"On 17 Nov 2025 the tribunal sentenced Sheikh Hasina to death in the first July case."},
