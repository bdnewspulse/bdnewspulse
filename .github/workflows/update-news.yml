name: Update news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch news
        run: node update-news.mjs
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update news"
            git push
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi
